name: Static checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Prettier
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Type-check
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit
